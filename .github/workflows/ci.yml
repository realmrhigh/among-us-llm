name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build impostor/src/Impostor.LlmBots.Tests -c Release

      - name: Test
        run: dotnet test impostor/src/Impostor.LlmBots.Tests -c Release --no-build --logger "console;verbosity=normal"

      # Proves that the server itself publishes the way run-server.cmd / run-server.sh do it.
      - name: Publish the server
        run: dotnet publish impostor/src/Impostor.Server -c Release -o server --nologo -v q

      # The Windows launch scripts, run the way a user runs them (Windows PowerShell 5.1 behind the .cmd wrappers).
      - name: Smoke test run-server.cmd
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $proc = Start-Process cmd.exe -ArgumentList '/c', 'run-server.cmd' -PassThru -NoNewWindow -RedirectStandardOutput server-out.log -RedirectStandardError server-err.log
          $ok = $false
          for ($i = 0; $i -lt 90 -and -not $proc.HasExited; $i++) {
              Start-Sleep -Seconds 2
              try {
                  $r = Invoke-WebRequest -UseBasicParsing http://localhost:22023/llmbots/status -TimeoutSec 5
                  if ($r.StatusCode -eq 200) { $ok = $true; break }
              } catch { }
          }
          Get-Content server-out.log, server-err.log -ErrorAction SilentlyContinue
          taskkill /PID $proc.Id /T /F | Out-Null
          if (-not $ok) { throw 'The server did not come up' }
          Write-Host $r.Content

      - name: Smoke test selfplay.cmd
        if: runner.os == 'Windows'
        shell: cmd
        run: selfplay.cmd --llm mock --players 5 --speed 6 --seed 3
