name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build impostor/src/Impostor.LlmBots.Tests -c Release

      - name: Test
        run: dotnet test impostor/src/Impostor.LlmBots.Tests -c Release --no-build --logger "console;verbosity=normal"

      # Proves that the server itself publishes the way run-server.cmd / run-server.sh do it.
      - name: Publish the server
        run: dotnet publish impostor/src/Impostor.Server -c Release -o server --nologo -v q
